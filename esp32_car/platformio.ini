[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    madhephaestus/ESP32Servo@^3.0.5
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7.2.0

; ====== Bản DEBUG: bật log Serial, menu test, in telemetry ======
[env:debug]
build_flags = -DDEBUG_MODE=1
build_src_filter =
    +<main.cpp>
    -<main_release.cpp>
    -<main_work.cpp>

; ====== Bản PRODUCT: tắt log cho chạy nhanh/gọn ======
[env:release]
build_flags =
    -DDEBUG_MODE=0
    -DNDEBUG
    -Os
build_src_filter =
    -<main.cpp>
    +<main_release.cpp>
    -<main_work.cpp>

; ====== Bản WORK: main release độc lập, có chú thích để đưa vào báo cáo ======
[env:work]
build_flags =
    -DNDEBUG
    -Os
build_src_filter =
    -<main.cpp>
    -<main_release.cpp>
    +<main_work.cpp>

; ====== Flash qua WiFi (OTA) - dung sau khi da flash USB 1 lan ======
; Chay:  pio run -e ota -t upload     (hoac .\flash.ps1 -Ota)
[env:ota]
build_flags = -DDEBUG_MODE=1
build_src_filter =
    +<main.cpp>
    -<main_release.cpp>
    -<main_work.cpp>
upload_protocol = espota
; Ten mDNS (ArduinoOTA.setHostname) - KHONG can sua khi DHCP doi IP xe.
; Neu mang chan mDNS thi thay bang IP: xem serial luc boot ">> OTA san sang ... (IP x.x.x.x)"
upload_port = esp32-car.local
