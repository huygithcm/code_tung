<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AGV giao hàng</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🚚 AGV giao hàng</h1>
  <div style="display:flex;gap:10px;align-items:center">
    <a class="badge on" href="/scan.html">📷 Quét QR</a>
    <a class="badge on" href="/qr.html">🔳 QR test</a>
    <a class="badge on" href="/admin.html">🛠️ Quản lý hàng</a>
    <div id="conn" class="badge off">● mất kết nối</div>
  </div>
</header>

<main>
  <!-- CỘT TRÁI: bản đồ + trạng thái -->
  <section class="panel">
    <h2>🗺️ Bản đồ &amp; vị trí xe</h2>
    <canvas id="map" width="520" height="560"></canvas>
    <div id="status" class="status">Đang chờ dữ liệu…</div>
  </section>

  <!-- CỘT PHẢI: điều khiển + log -->
  <section class="panel">
    <h2>🎮 Điều khiển</h2>
    <div class="row" id="goButtons" style="flex-wrap:wrap"></div>
    <div class="row">
      <button class="btn b-home" onclick="cmd({cmd:'home'})">🏠 Về HOME</button>
      <button class="btn b-stop" onclick="cmd({cmd:'stop'})">■ DỪNG</button>
      <button class="btn b-go" onclick="calibLine()">🎯 Calib line</button>
      <button class="btn b-go" onclick="resetPose()">📍 Đặt lại vị trí = HOME</button>
    </div>
    <h3>Lái tay</h3>
    <div class="dpad">
      <button class="btn" onmousedown="manual('F')" ontouchstart="manual('F')">▲</button>
      <div class="dpad-mid">
        <button class="btn" onmousedown="manual('L')" ontouchstart="manual('L')">◀</button>
        <button class="btn b-stop" onmousedown="manual('S')" ontouchstart="manual('S')">■</button>
        <button class="btn" onmousedown="manual('R')" ontouchstart="manual('R')">▶</button>
      </div>
      <button class="btn" onmousedown="manual('B')" ontouchstart="manual('B')">▼</button>
    </div>

    <h3>🔧 Test servo</h3>
    <div class="row">
      <button class="btn b-go" onclick="servoTest('drop')">📦 Thả</button>
      <button class="btn b-go" onclick="servoTest('hold')">🔒 Giữ</button>
    </div>

    <h3>🛰️ Cảm biến / Gyro</h3>
    <div class="row" style="flex-wrap:wrap">
      <button class="btn b-go" onclick="gyroCal()">🎯 Đo trôi tĩnh gyro</button>
      <button class="btn b-go" onclick="send({cmd:'i2cscan'})">🔍 Quét I2C</button>
      <button class="btn b-go" onclick="send({cmd:'line'})">📟 Đọc 8 mắt line</button>
      <button class="btn b-go" onclick="send({cmd:'linezero'})">🎯 Đặt tâm line</button>
    </div>

    <h2>📜 Nhật ký giao hàng</h2>
    <ul id="log" class="log"></ul>

    <h2>🖥️ Log xe
      <button class="btn b-stop" style="float:right;padding:4px 10px;font-size:.8em" onclick="clearCarLog()">Xóa</button>
    </h2>
    <div id="carlog" class="carlog"></div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
