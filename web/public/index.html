<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🚚 Xe giao hàng — Điều khiển & Giám sát</title>
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
<header>
  <h1>🚚 Xe giao hàng dò line + quét QR</h1>
  <div style="display:flex;gap:10px;align-items:center">
    <a class="badge on" href="/qr.html">🔳 QR test</a>
    <a class="badge on" href="/admin.html">🛠️ Quản lý hàng</a>
    <div id="conn" class="badge off">● mất kết nối</div>
  </div>
</header>

<main>
  <!-- CỘT TRÁI: bản đồ + trạng thái -->
  <section class="panel">
    <h2>🗺️ Bản đồ &amp; vị trí xe</h2>
    <canvas id="map" width="520" height="560"></canvas>
    <div id="status" class="status">Đang chờ dữ liệu…</div>
  </section>

  <!-- CỘT PHẢI: điều khiển + QR + log -->
  <section class="panel">
    <h2>📷 Quét QR (camera điện thoại)</h2>
    <div id="reader"></div>
    <div class="row">
      <button class="btn b-start" id="qrStart">Bật camera</button>
      <button class="btn b-stop"  id="qrStop">Tắt camera</button>
    </div>
    <div id="qrResult" class="qr-result">Chưa quét.</div>

    <h2>🎮 Điều khiển</h2>
    <div class="row" id="goButtons" style="flex-wrap:wrap"></div>
    <div class="row">
      <button class="btn b-home" onclick="cmd({cmd:'home'})">🏠 Về HOME</button>
      <button class="btn b-stop" onclick="cmd({cmd:'stop'})">■ DỪNG</button>
      <button class="btn b-go" onclick="calibLine()">🎯 Calib line</button>
    </div>
    <h3>Lái tay</h3>
    <div class="dpad">
      <button class="btn" onmousedown="manual('F')" ontouchstart="manual('F')">▲</button>
      <div class="dpad-mid">
        <button class="btn" onmousedown="manual('L')" ontouchstart="manual('L')">◀</button>
        <button class="btn b-stop" onmousedown="manual('S')" ontouchstart="manual('S')">■</button>
        <button class="btn" onmousedown="manual('R')" ontouchstart="manual('R')">▶</button>
      </div>
      <button class="btn" onmousedown="manual('B')" ontouchstart="manual('B')">▼</button>
    </div>

    <h2>⚙️ Chỉnh tốc độ / PID (runtime)</h2>
    <div class="tune">
      <label>baseSpeed<input id="t-base" type="number" min="0" max="255" value="200"></label>
      <label>MIN PWM<input id="t-min" type="number" min="0" max="255" value="120"></label>
      <label>Kp<input id="t-kp" type="number" step="0.5" value="25"></label>
      <label>Kd<input id="t-kd" type="number" step="0.5" value="15"></label>
      <label>TURN_MIN<input id="t-turnmin" type="number" min="0" max="255" value="160"></label>
      <label>speed tay<input id="t-speed" type="number" min="0" max="255" value="210"></label>
      <button class="btn b-go" onclick="applyTune()">Áp dụng</button>
    </div>

    <h2>📜 Nhật ký giao hàng</h2>
    <ul id="log" class="log"></ul>

    <h2>🖥️ Log xe (ESP32)
      <button class="btn b-stop" style="float:right;padding:4px 10px;font-size:.8em" onclick="clearCarLog()">Xóa</button>
    </h2>
    <div id="carlog" class="carlog"></div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
